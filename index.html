<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>اختبار الذاكرة (02)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one column for phones, one question per screen, answers within thumb reach, sticky "next" bar at the bottom. */
:root {
  --bg: #F1F4F6;
  --surface: #FFFFFF;
  --ink: #13232C;
  --muted: #5B6B74;
  --line: #D9E1E6;
  --accent: #0B7A85;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDF0F2;
  --good: #17794F;
  --good-soft: #DDF3E8;
  --bad: #B83A3A;
  --bad-soft: #F9E1E1;
  --f-display: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  --f-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D161B; --surface: #15232A; --ink: #E8EFF2; --muted: #93A6AF; --line: #263841;
    --accent: #4CC2CD; --accent-ink: #07242A; --accent-soft: #16363C;
    --good: #52C795; --good-soft: #123626; --bad: #F08585; --bad-soft: #3B1B1D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D161B; --surface: #15232A; --ink: #E8EFF2; --muted: #93A6AF; --line: #263841;
  --accent: #4CC2CD; --accent-ink: #07242A; --accent-soft: #16363C;
  --good: #52C795; --good-soft: #123626; --bad: #F08585; --bad-soft: #3B1B1D;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  direction: rtl;
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.7;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 520px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
h1, h2, h3, .display { font-family: var(--f-display); text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Start screen */
.hero { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.eyebrow { font-size: 14px; color: var(--accent); font-weight: 600; letter-spacing: .02em; }
.hero h1 { font-size: 44px; font-weight: 800; line-height: 1.2; }
.hero .lead { color: var(--muted); font-size: 17px; }
.bismillah { font-family: var(--f-display); font-size: 15px; color: var(--muted); }
.net { width: 100%; max-width: 260px; height: auto; color: var(--accent); margin-block: 4px; }
.facts { display: flex; gap: 10px; flex-wrap: wrap; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-size: 15px; font-weight: 500; }
.fact b { font-family: var(--f-display); font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  min-height: 54px; border: 0; border-radius: 14px; padding: 12px 20px;
  background: var(--accent); color: var(--accent-ink);
  font-family: var(--f-display); font-weight: 700; font-size: 18px;
}
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn:active { transform: scale(.985); }

/* Quiz */
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.top .count { font-family: var(--f-display); font-weight: 700; color: var(--ink); font-size: 16px; }
.progress { display: flex; gap: 4px; }
.seg { flex: 1; height: 6px; border-radius: 3px; background: var(--line); transition: background .25s; }
.seg.now { background: var(--accent); }
.seg.ok { background: var(--good); }
.seg.no { background: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px 18px; }
.qtext { font-size: 20px; font-weight: 600; line-height: 1.75; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: start;
  min-height: 58px; padding: 12px 14px; border-radius: 14px;
  background: var(--surface); border: 1.5px solid var(--line); color: var(--ink);
  font-size: 16px; line-height: 1.6; transition: background .2s, border-color .2s, opacity .2s;
}
.opt .k {
  flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-family: var(--f-display); font-weight: 800; font-size: 16px;
}
.opt .t { flex: 1; min-width: 0; }
.opt .mark { flex: none; width: 22px; height: 22px; display: none; }
.opt:not(:disabled):active { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.good { border-color: var(--good); background: var(--good-soft); }
.opt.good .k { background: var(--good); color: var(--surface); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .k { background: var(--bad); color: var(--surface); }
.opt.good .mark, .opt.bad .mark { display: block; }
.opt.good .mark { color: var(--good); }
.opt.bad .mark { color: var(--bad); }
.opt.dim { opacity: .55; }

.fb { border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.fb.good { background: var(--good-soft); }
.fb.bad { background: var(--bad-soft); }
.fb .h { font-family: var(--f-display); font-weight: 800; font-size: 17px; }
.fb.good .h { color: var(--good); }
.fb.bad .h { color: var(--bad); }
.fb .x { font-size: 15.5px; }

.bar { position: sticky; bottom: 0; padding-block: 12px 4px; background: linear-gradient(to top, var(--bg) 72%, transparent); }

/* Result */
.score { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 8px 0; }
.ring { width: 170px; height: 170px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); transition: stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1); }
.ring .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 44px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.ring .num small { display: block; font-size: 14px; font-weight: 600; color: var(--muted); }
.score h2 { font-size: 26px; font-weight: 800; }
.score p { color: var(--muted); }
.actions { display: flex; flex-direction: column; gap: 10px; }
.sec-title { font-family: var(--f-display); font-weight: 700; font-size: 18px; margin-top: 6px; }
.rev { display: flex; flex-direction: column; gap: 10px; }
.rev-item { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.rev-item .n { font-size: 13px; color: var(--muted); font-weight: 600; }
.rev-item .q { font-weight: 600; line-height: 1.7; }
.rev-item .a { font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.rev-item .a b { flex: none; font-weight: 600; }
.rev-item .a.no { color: var(--bad); }
.rev-item .a.yes { color: var(--good); }
.rev-item .why { font-size: 14.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
.allgood { background: var(--good-soft); color: var(--good); border-radius: 14px; padding: 14px 16px; font-weight: 600; text-align: center; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (min-width: 560px) { .hero h1 { font-size: 52px; } }
</style>

<div class="wrap" dir="rtl" lang="ar">

  <section id="start" class="hero">
    <p class="eyebrow">اللدونة العصبية · كيف يطوّر الدماغ بنيته</p>
    <p class="bismillah">بسم الله نبدأ لبلوغ كل هدف</p>
    <h1>الذاكرة (02)</h1>
    <svg class="net" viewBox="0 0 260 90" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M20 60 L70 25 L120 55 L170 20 L225 52 M70 25 L100 78 L120 55 M170 20 L200 76 L225 52 M100 78 L200 76" opacity=".55"/>
      <g fill="var(--bg)">
        <circle cx="20" cy="60" r="7"/><circle cx="70" cy="25" r="9"/><circle cx="120" cy="55" r="11"/>
        <circle cx="170" cy="20" r="8"/><circle cx="225" cy="52" r="9"/><circle cx="100" cy="78" r="6"/><circle cx="200" cy="76" r="7"/>
      </g>
      <circle cx="120" cy="55" r="4.5" fill="currentColor" stroke="none"/>
    </svg>
    <p class="lead">اختبر فهمك لحلقة اليوم: تصنيف أنظمة الذاكرة حسب مدة الاحتفاظ وحسب طبيعة المعلومات والوعي بها.</p>
    <div class="facts">
      <span class="fact"><b>12</b> سؤالًا</span>

    <button class="btn" id="go" type="button">ابدأ الاختبار</button>

  <section id="quiz" hidden>

            <circle class="bg" cx="60" cy="60" r="52"/>
            <circle class="fg" id="ringfg" cx="60" cy="60" r="52" stroke-dasharray="326.73" stroke-dashoffset="326.73"/>
          </svg>
          <div class="num"><span id="rnum"></span><small id="rpct"></small></div>
        </div>
        <h2 id="rtitle"></h2>
        <p id="rsub"></p>
      </div>
      <div class="actions" id="ract"></div>
      <div id="rev"></div>
    </div>
  </section>

</div>

<script>
var Q = [
  { q: "ما الذي كشفته قصة هنري موليسون عن الذاكرة؟",
    o: ["أن الذاكرة نظام واحد يؤدي جميع الوظائف", "أن الذاكرة تتكون من أنظمة متعددة تختلف في وظائفها", "أن فقدان الذاكرة يمنع اكتساب أي مهارة جديدة", "أن جميع الذكريات تعتمد على الحصين بالدرجة نفسها"],
    a: 1, e: "اكتسب هنري مهارة جديدة دون أن يتذكّر أنه تعلّمها، وهذا يدل على أن الذاكرة أنظمة متعددة لكل منها وظيفته." },
  { q: "عندما تحرّك قلمًا مضيئًا بسرعة في الهواء فتراه كأنه يرسم دائرة متصلة، فما نوع الذاكرة المسؤول عن ذلك؟",
    o: ["الذاكرة السمعية", "الذاكرة الدلالية", "الذاكرة الحسية البصرية", "الذاكرة الإجرائية"],
    a: 2, e: "الذاكرة الحسية البصرية تحتفظ بصورة كل موقع مرّ به القلم لجزء من الثانية، فيظهر وهم الدائرة المتصلة." },
  { q: "ما الذي يفسّر قدرتك أحيانًا على تذكّر آخر كلمات شخص بعد أن تطلب منه إعادتها؟",
    o: ["الذاكرة الحسية السمعية", "الذاكرة العرضية", "الذاكرة الإجرائية", "الذاكرة الدلالية"],
    a: 0, e: "الدماغ يحتفظ بالصدى السمعي للكلام لبضع ثوانٍ، فتستطيع استرجاعه بمجرد أن توجّه انتباهك إليه." },
  { q: "أي مثال يعبّر بصورة أفضل عن الذاكرة قصيرة المدى؟",
    o: ["تذكّر أحداث طفولتك", "معرفة عاصمة فرنسا", "الاحتفاظ برقم هاتف مؤقتًا حتى تدوينه", "ركوب الدراجة دون التفكير في كل حركة"],
    a: 2, e: "الذاكرة قصيرة المدى تحتفظ بقدر محدود من المعلومات لفترة وجيزة، مثل رقم هاتف نتذكّره للحظات حتى نكتبه." },
  { q: "أي العبارات أدق بشأن الذاكرة طويلة المدى؟",
    o: ["تحتفظ بالمعلومات لثوانٍ فقط", "تحتفظ بالمعارف والأحداث والمهارات لفترات قد تطول", "تقتصر على الأحداث الشخصية", "تعمل دون أي تغير في الدماغ"],
    a: 1, e: "الذاكرة طويلة المدى تحفظ المعارف والأحداث والمهارات لفترات تمتد من أيام إلى سنوات، بل مدى الحياة." },
  { q: "تذكّرك أن باريس عاصمة فرنسا مثال على:",
    o: ["الذاكرة العرضية", "الذاكرة الحسية", "الذاكرة الدلالية", "الذاكرة الإجرائية"],
    a: 2, e: "الذاكرة الدلالية تحفظ الحقائق والمعارف، ومنها معرفتنا بأن باريس عاصمة فرنسا." },
  { q: "تذكّرك رحلة قمت بها، والأماكن التي زرتها وما حدث خلالها، مثال على:",
    o: ["الذاكرة العرضية", "الذاكرة الدلالية", "التهيئة", "الذاكرة الحسية السمعية"],
    a: 0, e: "الذاكرة العرضية تحفظ أحداثًا شخصية عشناها، مثل رحلة وما وقع خلالها." },
  { q: "ما الدور الأساسي للحصين عند تكوين ذكرى جديدة؟",
    o: ["تخزين جميع الذكريات إلى الأبد في مكان واحد", "ربط جوانب مختلفة من التجربة لتكوين ذكرى مترابطة", "التحكم في جميع الحركات العضلية", "منع انتقال المعلومات إلى القشرة المخية"],
    a: 1, e: "الحصين يربط المعلومات الحسية الموزعة في القشرة المخية (الصوت والصورة والمكان) في شبكة مترابطة واحدة." },
  { q: "لماذا قد تبقى بعض الذكريات القديمة رغم تضرر الحصين؟",
    o: ["لأن الحصين لا يشارك أبدًا في تكوين الذكريات", "لأن الذكريات القديمة تتحول إلى ذكريات حسية", "لأن بعض الذكريات تصبح أكثر اعتمادًا على شبكات في القشرة المخية مع مرور الوقت", "لأن كل الذكريات تُخزّن في العضلات"],
    a: 2, e: "بمرور الوقت وعبر عملية التوطيد، تصبح الشبكة قوية بما يكفي لتعمل بشكل مستقل ولا تحتاج الحصين حاجة ماسّة." },
  { q: "ما الذي يميّز الذاكرة الصريحة عن الذاكرة الضمنية؟",
    o: ["الصريحة تتعلق بالماضي فقط، والضمنية بالمستقبل فقط", "الصريحة يمكن استحضار محتواها بوعي، بينما يظهر أثر الضمنية في الأداء والسلوك دون استحضار واعٍ للتعلّم", "الصريحة لا تستمر طويلًا، والضمنية تستمر مدى الحياة دائمًا", "لا يوجد فرق بينهما"],
    a: 1, e: "الصريحة نستحضر محتواها بوعي ونعبّر عنه بالكلمات، أما الضمنية فيظهر أثرها في أدائنا وسلوكنا دون استحضار واعٍ لتجربة التعلّم." },
  { q: "تعلّم ركوب الدراجة وأداء الحركات اللازمة دون التفكير في كل خطوة مثال على:",
    o: ["الذاكرة الدلالية", "الذاكرة العرضية", "الذاكرة الإجرائية", "الذاكرة الحسية البصرية"],
    a: 2, e: "الذاكرة الإجرائية تساعدنا على اكتساب المهارات والعادات، مثل ركوب الدراجة أو الكتابة على لوحة المفاتيح." },
  { q: "بعد رؤية كلمة مرات سابقة، أصبحت تتعرّف عليها بسرعة أكبر حتى دون تذكّر أنك رأيتها من قبل. ما التفسير الأقرب؟",
    o: ["التهيئة", "الذاكرة العرضية", "الذاكرة قصيرة المدى فقط", "فقدان الذاكرة"],
    a: 0, e: "التهيئة تجعل تعرّفنا على بعض المعلومات أو استجابتنا لها أسرع نتيجة تعرّض سابق لها." }
];

var LET = ["أ", "ب", "ج", "د"];
var CHECK = '<svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
var CROSS = '<svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>';

var order = [], pos = 0, picks = {}, locked = false;

function $(id) { return document.getElementById(id); }
function show(id) {
  ["start", "quiz", "result"].forEach(function (s) { $(s).hidden = (s !== id); });
  window.scrollTo(0, 0);
}
function begin(list) {
  order = list; pos = 0; picks = {}; locked = false;
  show("quiz"); renderQ();
}
function correctCount() {
  return order.filter(function (qi) { return picks[qi] === Q[qi].a; }).length;
}
function renderProg() {
  var h = "";
  order.forEach(function (qi, i) {
    var c = "seg";
    if (i < pos || (i === pos && locked)) c += (picks[qi] === Q[qi].a) ? " ok" : " no";
    else if (i === pos) c += " now";
    h += '<span class="' + c + '"></span>';
  });
  $("prog").innerHTML = h;
}
function renderQ() {
  var qi = order[pos], q = Q[qi];
  locked = false;
  $("count").textContent = "السؤال " + (pos + 1) + " من " + order.length;
  $("live").textContent = "الصحيحة: " + correctCount();
  $("qtext").textContent = q.q;
  $("fb").innerHTML = "";
  $("bar").hidden = true;
  var h = "";
  q.o.forEach(function (t, i) {
    h += '<button type="button" class="opt" data-i="' + i + '"><span class="k">' + LET[i] + '</span><span class="t">' + t + '</span>' + CHECK + '</button>';
  });
  $("opts").innerHTML = h;
  renderProg();
}
function choose(i) {
  if (locked) return;
  locked = true;
  var qi = order[pos], q = Q[qi], ok = (i === q.a);
  picks[qi] = i;
  var btns = $("opts").querySelectorAll(".opt");
  btns.forEach(function (b, k) {
    b.disabled = true;
    if (k === q.a) b.classList.add("good");
    else if (k === i) { b.classList.add("bad"); b.querySelector(".mark").outerHTML = CROSS.replace('class="mark"', 'class="mark"'); }
    else b.classList.add("dim");
  });
  $("fb").innerHTML = '<div class="fb ' + (ok ? "good" : "bad") + '"><span class="h">' + (ok ? "إجابة صحيحة" : "إجابة غير صحيحة") + '</span><span class="x">' + q.e + '</span></div>';
  $("live").textContent = "الصحيحة: " + correctCount();
  $("next").textContent = (pos === order.length - 1) ? "عرض النتيجة" : "السؤال التالي";
  $("bar").hidden = false;
  renderProg();
  setTimeout(function () { $("bar").scrollIntoView({ behavior: "smooth", block: "end" }); }, 60);
}
function next() {
  if (pos < order.length - 1) { pos++; window.scrollTo(0, 0); renderQ(); }
  else renderResult();
}
function renderResult() {
  show("result");
  var n = order.length, c = correctCount(), pct = Math.round(c / n * 100);
  $("rnum").innerHTML = c + " / " + n + "<small>" + pct + "%</small>";
  $("rpct").textContent = "";
  var t, s;
  if (pct >= 85) { t = "ممتاز"; s = "فهمت الحلقة جيدًا ويمكنك الانتقال إلى الحلقة التالية."; }
  else if (pct >= 60) { t = "جيد"; s = "أنت على الطريق الصحيح، راجع الأسئلة التي أخطأت فيها."; }
  else if (pct >= 35) { t = "تحتاج إلى مراجعة"; s = "أعد قراءة الحلقة ثم جرّب الاختبار من جديد."; }
  else { t = "ابدأ بقراءة الحلقة"; s = "اقرأ الحلقة بهدوء ثم أعد الاختبار."; }
  $("rtitle").textContent = t;
  $("rsub").textContent = s;
  var circ = 326.73;
  $("ringfg").style.strokeDashoffset = circ;
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    $("ringfg").style.strokeDashoffset = circ * (1 - c / n);
  }); });

  var wrong = order.filter(function (qi) { return picks[qi] !== Q[qi].a; });
  var act = '';
  if (wrong.length) act += '<button class="btn" type="button" id="retryw">أعد الأسئلة الخاطئة (' + wrong.length + ')</button>';
  act += '<button class="btn ghost" type="button" id="retrya">أعد الاختبار كاملًا</button>';
  $("ract").innerHTML = act;
  if (wrong.length) $("retryw").onclick = function () { begin(wrong.slice()); };
  $("retrya").onclick = function () { begin(Q.map(function (_, i) { return i; })); };

  var r = '';
  if (!wrong.length) r = '<p class="allgood">أجبت عن كل الأسئلة إجابة صحيحة.</p>';
  else {
    r = '<h3 class="sec-title">مراجعة الأخطاء</h3><div class="rev">';
    wrong.forEach(function (qi) {
      var q = Q[qi];
      r += '<div class="rev-item"><span class="n">السؤال ' + (qi + 1) + '</span><p class="q">' + q.q + '</p>' +
        '<p class="a no"><b>إجابتك:</b><span>' + q.o[picks[qi]] + '</span></p>' +
        '<p class="a yes"><b>الصحيحة:</b><span>' + q.o[q.a] + '</span></p>' +
        '<p class="why">' + q.e + '</p></div>';
    });
    r += '</div>';
  }
  $("rev").innerHTML = r;
}

$("go").onclick = function () { begin(Q.map(function (_, i) { return i; })); };
$("next").onclick = next;
$("opts").addEventListener("click", function (e) {
  var b = e.target.closest(".opt");
  if (b) choose(parseInt(b.getAttribute("data-i"), 10));
});
</script>
